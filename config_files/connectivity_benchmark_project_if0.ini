[connectivity]
# ========================================
# Kernel实例化（接口从0开始）
# ========================================
nk=krnl_mm2s:1:krnl_mm2s_0
nk=krnl_s2mm:1:krnl_s2mm_0
nk=krnl_s2mm:1:krnl_s2mm_1              # 🆕 新增：接收event流
nk=stream_throughput:1:stream_throughput_0
nk=krnl_proj:1:krnl_proj_0

# ========================================
# 数据流连接
# ========================================
# mm2s -> stream_throughput（输入数据源）
stream_connect=krnl_mm2s_0.k2n:stream_throughput_0.input_stream

# stream_throughput -> krnl_proj（进入匹配引擎）
stream_connect=stream_throughput_0.output_stream:krnl_proj_0.n2k

# krnl_proj -> s2mm_0（payload流，原样透传）
stream_connect=krnl_proj_0.k2n_payload:krnl_s2mm_0.n2k

# krnl_proj -> s2mm_1（event流，匹配结果）🆕
stream_connect=krnl_proj_0.k2n_events:krnl_s2mm_1.n2k

# ========================================
# Memory连接（根据你的硬件平台选择）
# ========================================
# 如果使用HBM（推荐U55C）
sp=krnl_mm2s_0.in:HBM[0]
sp=krnl_s2mm_0.out:HBM[1]
sp=krnl_s2mm_1.out:HBM[2]            
  
# 如果使用DDR（备选方案，注释掉上面的HBM配置）
# sp=krnl_mm2s_0.in:DDR[0]
# sp=krnl_s2mm_0.out:DDR[1]
# sp=krnl_s2mm_1.out:DDR[2]

; # ========================================
; # 时钟频率配置
; # ========================================
; [clock]
; id=0:krnl_mm2s_0
; id=1:krnl_s2mm_0
; id=2:krnl_s2mm_1
; id=3:stream_throughput_0
; id=4:krnl_proj_0

; freqHz=300000000:krnl_mm2s_0
; freqHz=300000000:krnl_s2mm_0
; freqHz=300000000:krnl_s2mm_1
; freqHz=300000000:stream_throughput_0
; freqHz=300000000:krnl_proj_0